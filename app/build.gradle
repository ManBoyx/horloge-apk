apply plugin: 'com.android.application'

// La clé de signature vit dans signature/ (hors git). Sans elle, l'APK de
// version n'est pas signé.
def fichierCle = rootProject.file('signature/cle.properties')
def cle = new Properties()
if (fichierCle.exists()) {
    fichierCle.withInputStream { cle.load(it) }
}

android {
    namespace 'fr.manboyx.horloge'
    compileSdk 36

    defaultConfig {
        applicationId 'fr.manboyx.horloge'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        diffusion {
            if (fichierCle.exists()) {
                storeFile rootProject.file('signature/horloge.jks')
                storePassword cle['motDePasse']
                keyAlias 'horloge'
                keyPassword cle['motDePasse']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (fichierCle.exists()) {
                signingConfig signingConfigs.diffusion
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }

    testOptions {
        unitTests {
            // Les tests d'écran lisent les vraies mises en page.
            includeAndroidResources = true
            all {
                maxHeapSize = '900m'
                // ./gradlew testDebugUnitTest -Dcaptures.dir=/un/dossier écrit des
                // images des écrans (voir CapturesTest).
                systemProperty 'captures.dir', System.getProperty('captures.dir') ?: ''
            }
        }
    }

    // Bloc destiné au Play Store, inutile pour un APK installé à la main.
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
}

dependencies {
    // Tests seulement : rien de ceci n'entre dans l'APK.
    testImplementation 'junit:junit:4.13.2'
    // Simulateur Android pour vérifier les écrans et les widgets sans téléphone.
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
